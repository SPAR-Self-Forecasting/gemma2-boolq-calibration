max_steps = 50
seq_len = 2048
max_async_level = 0

[model]
name = "google/gemma-2-2b-it"

[wandb]
project = "calibrated-qa"
name = "calibrated-qa-gemma2-2b"

[orchestrator]
# batch_size = total rollouts per step (NOT number of questions)
# 128 questions * 8 rollouts = 1024 total rollouts
batch_size = 1024
rollouts_per_example = 8

[orchestrator.sampling]
max_tokens = 512

[[orchestrator.env]]
id = "calibrated-qa"
args = { log_dir = "/root/outputs/calibrated-qa-gemma2-2b/rl" }

[trainer.optim]
lr = 1e-6

[ckpt]

[inference]
gpu_memory_utilization = 0.9
